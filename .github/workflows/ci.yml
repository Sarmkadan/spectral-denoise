name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore SpectralDenoise.slnx

      - name: Build
        run: dotnet build SpectralDenoise.slnx --no-restore -c Release

      - name: Test
        run: dotnet test SpectralDenoise.slnx --no-build -c Release --verbosity normal
